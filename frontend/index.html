<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Eranda | Cyberistic Portfolio</title><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"><style>

:root {
  --glass-bg: rgba(255,255,255,0.08);
  --border: rgba(255,255,255,0.18);
  --text: #ffffff;
  --accent: #00e0ff;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Poppins', sans-serif;
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  color: var(--text);
  background: linear-gradient(135deg,#020024,#090979,#000000);
  overflow: hidden;
}

/* Animated background */
body::before {
  content: "";
  position: absolute;
  width: 200%;
  height: 200%;
  background: radial-gradient(circle at 30% 30%, #00e0ff22, transparent 40%),
              radial-gradient(circle at 70% 70%, #ffffff11, transparent 40%);
  animation: moveBg 12s linear infinite;
}

@keyframes moveBg {
  0% { transform: translate(0,0); }
  50% { transform: translate(-50px,-50px); }
  100% { transform: translate(0,0); }
}

.card {
  position: relative;
  backdrop-filter: blur(30px);
  background: var(--glass-bg);
  border-radius: 28px;
  padding: 40px 30px;
  width: 90%;
  max-width: 420px;
  text-align: center;
  border: 1px solid var(--border);
  box-shadow: 0 25px 60px rgba(0,0,0,0.6);
  animation: fadeIn 1.2s ease forwards;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(40px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.avatar {
  width: 110px;
  height: 110px;
  border-radius: 50%;
  background: linear-gradient(135deg,#00e0ff,#ffffff);
  margin: auto;
  display: flex;
  justify-content: center;
  align-items: center;
  font-size: 40px;
  font-weight: bold;
  color: black;
  margin-bottom: 20px;
  animation: pulse 3s infinite;
}

@keyframes pulse {
  0% { box-shadow: 0 0 0 0 rgba(0,224,255,0.5); }
  70% { box-shadow: 0 0 0 25px rgba(0,224,255,0); }
  100% { box-shadow: 0 0 0 0 rgba(0,224,255,0); }
}

h1 {
  font-size: 26px;
  font-weight: 700;
  margin-bottom: 6px;
}

.info {
  font-size: 14px;
  opacity: 0.85;
  margin-bottom: 25px;
  line-height: 1.6;
}

.btn {
  width: 100%;
  padding: 14px;
  border-radius: 16px;
  border: none;
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 14px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  transition: 0.3s;
}

.btn-primary {
  background: linear-gradient(135deg,#00e0ff,#00bcd4);
  color: black;
}

.btn-primary:hover {
  transform: translateY(-3px) scale(1.02);
}

.btn-secondary {
  background: transparent;
  border: 1px solid var(--border);
  color: white;
}

.btn-secondary:hover {
  background: rgba(255,255,255,0.1);
  transform: translateY(-3px);
}

.footer {
  margin-top: 20px;
  font-size: 12px;
  opacity: 0.7;
}

</style></head><body><div class="card"><div class="avatar">
E
</div><h1>Eranda</h1><div class="info">
📍 Location: Horana, Sri Lanka<br>
🎂 Age: 23 Years<br>
💻 Cyber Security & Developer Portfolio

<i class="fas fa-link"></i>
Pair Device

<i class="fas fa-user-cog"></i>
Control Panel
</a><div class="footer">
Cyberistic Glass UI • iOS Style • 2026
</div></div></body>
</html>
